[run]
bun = true

[install]
exact = true
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = ["@types/bun", "typescript"]

[fmt]
sortImports = true
sortTailwindcss = true
sortPackageJson = true
ignorePatterns = [
  "vendor/",
  "drizzle/",
  "**/*.gen.ts",
  # generated by the tools below, so the formatter would fight them
  "**/generated/",
  "apps/api/openapi.json",
  # vendored skills and prose docs are not formatted
  ".agents/",
  ".claude/",
  "skills-lock.json",
  "**/*.md",
]
